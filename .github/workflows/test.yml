name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[qkrylov]' pytest
      - run: python -m pytest -q
      - run: python scripts/benchmark_qkrylov.py --qubits 2 --dimension 2 --time-step 0.2 --trotter-steps 1 --shots 20000 --minimum-shots 100 --json
